services:
  - type: web
    name: jeet-chalthanwala-portfolio
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: portfolio_db
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SITE_URL
        value: https://chalthanwala.freedev.app
      - key: VITE_API_URL
        value: https://portfolio-backend-jahq.onrender.com
      - key: CORS_ORIGINS
        value: https://chalthanwala.freedev.app
      - key: SESSION_COOKIE_SAME_SITE
        value: none
